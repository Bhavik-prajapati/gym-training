<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="title-row">
        <div>
          <p class="eyebrow">Daily plan</p>
          <h1>Workout</h1>
        </div>
        <button class="icon-btn" id="toggleViewBtn" type="button" aria-label="Show weekly plan">Week</button>
      </div>

      <p id="dayTitle" class="day-label"></p>

      <div class="progress-box" aria-label="Workout progress">
        <div id="progressBar"></div>
      </div>
      <span id="progressText"></span>
    </header>

    <section class="top-actions" aria-label="Quick actions">
      <button id="restBtn" type="button">Rest 60s</button>
      <button id="waterBtn" type="button">Add water</button>
      <button id="resetBtn" type="button">Reset day</button>
    </section>

    <section class="stats" aria-label="Workout stats">
      <p id="streak">Streak: 0 days</p>
      <p id="water">Water: 0 glasses</p>
      <p id="sessionSummary">Training time: 0:00</p>
      <p id="timer"></p>
    </section>

    <section id="exerciseContainer" class="exercise-list" aria-label="Exercises"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
